<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>词卡 · ทบทวนคำศัพท์ HSK</title>
<style>
  :root{
    --rice:#F7F1E3;
    --rice-2:#EFE6D0;
    --clay:#E4D9C4;
    --ink:#262220;
    --ink-soft:#5c5450;
    --seal:#B3242A;
    --seal-dark:#8C1A20;
    --gold:#C29650;
    --jade:#6E8B6B;
    --jade-dark:#4f6a4d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(178,36,42,0.05), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(194,150,80,0.08), transparent 45%),
      var(--rice);
    color:var(--ink);
    font-family: "Sarabun","Noto Sans Thai","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px 40px;
  }
  .cjk{ font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif; }

  /* header */
  header{
    width:100%;
    max-width:480px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{ display:flex; flex-direction:column; }
  .brand .zh{ font-size:22px; font-weight:700; letter-spacing:1px; }
  .brand .th{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .seal-btn{
    width:46px;height:46px;border-radius:50%;
    background:var(--rice-2);
    border:1.5px solid var(--gold);
    color:var(--seal);
    font-family:"Songti SC","STSong",serif;
    font-size:20px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:transform .15s ease;
  }
  .seal-btn:active{ transform:scale(0.92); }
  .seal-btn:focus-visible, button:focus-visible, .choice:focus-visible{
    outline:2px solid var(--seal); outline-offset:2px;
  }

  /* level picker */
  .levels{
    width:100%; max-width:480px;
    display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
  }
  .level-chip{
    flex:1; min-width:62px;
    padding:9px 6px;
    border-radius:10px;
    border:1.5px solid var(--clay);
    background:var(--rice-2);
    color:var(--ink);
    font-size:12.5px; font-weight:600;
    cursor:pointer;
    text-align:center;
    transition:.15s ease;
  }
  .level-chip.active{
    background:var(--seal); border-color:var(--seal-dark); color:#fff;
  }

  /* progress row */
  .progress-row{
    width:100%; max-width:480px;
    display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:var(--ink-soft);
    margin-bottom:10px;
  }
  .progress-track{
    flex:1; height:6px; border-radius:4px; background:var(--clay); overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--gold), var(--seal)); width:0%;
    transition:width .3s ease;
  }
  .retry-badge{
    background:var(--jade); color:#fff; border-radius:20px;
    padding:2px 9px; font-size:11.5px; font-weight:600; white-space:nowrap;
  }

  /* card */
  .card{
    width:100%; max-width:480px;
    background:#fffdf8;
    border:1px solid var(--clay);
    border-radius:20px;
    box-shadow:0 6px 24px rgba(38,34,32,0.08);
    padding:34px 22px 26px;
    text-align:center;
    position:relative;
    min-height:230px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--gold);
    border-radius:14px;
    opacity:.35;
    pointer-events:none;
  }
  .hanzi{
    font-size:64px; font-weight:700; line-height:1;
    margin-bottom:10px;
  }
  .pinyin{
    font-size:18px; color:var(--seal); font-style:italic; font-weight:600;
    letter-spacing:.5px;
  }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:14px; }

  .feedback{
    width:100%; max-width:480px;
    margin-top:12px; margin-bottom:2px;
    min-height:22px;
    font-size:14.5px; font-weight:600; text-align:center;
  }
  .feedback.correct{ color:var(--jade-dark); }
  .feedback.wrong{ color:var(--seal-dark); }

  /* choices */
  .choices{
    width:100%; max-width:480px;
    display:flex; flex-direction:column; gap:10px;
    margin-top:16px;
  }
  .choice{
    background:var(--rice-2);
    border:1.5px solid var(--clay);
    border-radius:14px;
    padding:13px 16px;
    text-align:left;
    cursor:pointer;
    font-size:15.5px;
    color:var(--ink);
    display:flex; flex-direction:column; gap:2px;
    transition:.15s ease;
  }
  .choice:not(.locked):active{ transform:scale(0.985); }
  .choice .th-line{ font-weight:600; }
  .choice .zh-line{ display:none; font-size:13px; color:var(--ink-soft); }
  .choice.reveal .zh-line{ display:block; }
  .choice.correct-answer{ border-color:var(--jade); background:#eef4ec; }
  .choice.wrong-pick{ border-color:var(--seal); background:#f7e9e8; }
  .choice.locked{ cursor:default; }

  .next-btn{
    width:100%; max-width:480px;
    margin-top:14px;
    padding:13px;
    border:none; border-radius:14px;
    background:var(--ink); color:#fff;
    font-size:15px; font-weight:700;
    cursor:pointer;
  }

  .done-screen{
    width:100%; max-width:480px; text-align:center; padding:40px 10px;
  }
  .done-screen .zh{ font-size:26px; font-weight:700; margin-bottom:6px; }
  .done-screen p{ color:var(--ink-soft); font-size:14px; margin-bottom:20px;}
  .done-screen button{
    padding:12px 22px; border-radius:12px; border:none;
    background:var(--seal); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(38,34,32,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--rice); width:100%; max-width:520px;
    border-radius:20px 20px 0 0;
    max-height:82vh; display:flex; flex-direction:column;
    padding:18px 16px 10px;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .modal-head .zh{ font-size:18px; font-weight:700; }
  .modal-head .close{
    background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;
  }
  .modal-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .modal-list{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-bottom:10px;}
  .vocab-row{
    background:#fffdf8; border:1px solid var(--clay); border-radius:12px;
    padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .vocab-main{ display:flex; flex-direction:column; }
  .vocab-main .zh{ font-size:17px; font-weight:700; }
  .vocab-main .py{ font-size:12.5px; color:var(--seal); font-style:italic; }
  .vocab-main .th{ font-size:12.5px; color:var(--ink-soft); }
  .status-pill{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .status-ok{ background:#e8f0e6; color:var(--jade-dark); }
  .status-retry{ background:#f7e9e8; color:var(--seal-dark); }
  .empty-note{ color:var(--ink-soft); font-size:13.5px; text-align:center; padding:30px 10px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="zh cjk">词卡 · HSK</div>
    <div class="th">ทบทวนคำศัพท์จีนกลาง</div>
  </div>

  <div class="level-chip" data-level="all">HSK 1-4</div>
</div>

<div class="progress-row" id="progressRow" style="display:none;">
  <span id="progressText">0 / 0</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <span class="retry-badge" id="retryBadge" style="display:none;">รอทบทวน 0</span>
</div>

<div id="quizArea"></div>

<!-- Vocab review modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="zh cjk">ทบทวนคำศัพท์</div>
      <button class="close" id="closeModal">✕</button>

    <div class="modal-sub">คำทั้งหมดที่เคยขึ้นให้ดู เก็บไว้ที่นี่ตลอด</div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

}
let reviewStore = loadStore(); // id -> {hanzi,pinyin,thai,level,status,wrongCount,lastSeen}

function recordSeen(word, status){
  const prev = reviewStore[word.id] || {wrongCount:0};
  reviewStore[word.id] = {
    hanzi: word.hanzi, pinyin: word.pinyin, thai: word.thai, level: word.level,
    status: status,
    wrongCount: prev.wrongCount + (status === "wrong" ? 1 : 0),
    lastSeen: Date.now()
  };
  saveStore(reviewStore);
}

/* ---------- QUIZ STATE ---------- */
let currentLevel = null;
let pool = [];
let queue = [];
let currentWord = null;
let currentChoices = [];
let answered = false;
let totalThisRound = 0;
let doneThisRound = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startLevel(levelKey){
  currentLevel = levelKey;
  pool = WORDS[levelKey];
  queue = shuffle(pool);
  totalThisRound = queue.length;
  doneThisRound = 0;
  document.getElementById("progressRow").style.display = "flex";
  document.querySelectorAll(".level-chip").forEach(el=>{
    el.classList.toggle("active", el.dataset.level === String(levelKey));
  });
  nextQuestion();
}

function updateProgress(){
  const pct = totalThisRound ? Math.round((doneThisRound/ (doneThisRound + queue.length + (answered?0:0)) )*100) : 0;
  // simpler: track completed vs remaining unique-ish
  const remaining = queue.length + (currentWord ? 1 : 0);
  const totalKnownSoFar = doneThisRound + remaining;
  const donePct = totalKnownSoFar ? Math.round((doneThisRound/totalKnownSoFar)*100) : 0;
  document.getElementById("progressFill").style.width = donePct + "%";
  document.getElementById("progressText").textContent = doneThisRound + " ตอบแล้ว";
  const retryCount = queue.filter(w=>w._retry).length;
  const badge = document.getElementById("retryBadge");
  if(retryCount > 0){
    badge.style.display = "inline-block";
    badge.textContent = "รอทบทวนอีก " + retryCount;
  } else {
    badge.style.display = "none";
  }
}

function pickDistractors(correctWord, n){
  const others = pool.filter(w => w.thai !== correctWord.thai);
  const shuffled = shuffle(others).slice(0, n);
  return shuffled;
}

function nextQuestion(){
  answered = false;
  if(queue.length === 0){
    renderDone();
    return;
  }
  currentWord = queue.shift();
  const distractors = pickDistractors(currentWord, 2);
  currentChoices = shuffle([currentWord, ...distractors]);
  updateProgress();
  renderQuiz();
}

function renderQuiz(){
  const area = document.getElementById("quizArea");
  area.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="hanzi cjk">${currentWord.hanzi}</div>
    <div class="pinyin">${currentWord.pinyin}</div>
    <div class="hint">เลือกความหมายที่ถูกต้อง</div>
  `;
  area.appendChild(card);

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = "feedback";
  area.appendChild(feedback);

  const choicesWrap = document.createElement("div");
  choicesWrap.className = "choices";
  currentChoices.forEach((w, idx)=>{
    const btn = document.createElement("div");
    btn.className = "choice";
    btn.tabIndex = 0;
    btn.dataset.idx = idx;
    btn.innerHTML = `
      <span class="th-line">${w.thai}</span>
      <span class="zh-line cjk">${w.hanzi} · ${w.pinyin}</span>
    `;
    btn.addEventListener("click", ()=> selectChoice(idx));
    btn.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" "){ selectChoice(idx); } });
    choicesWrap.appendChild(btn);
  });
  area.appendChild(choicesWrap);
}

function selectChoice(idx){
  if(answered) return;
  answered = true;
  const picked = currentChoices[idx];
  const isCorrect = picked.thai === currentWord.thai;
  const feedback = document.getElementById("feedback");

  document.querySelectorAll(".choice").forEach((el, i)=>{
    el.classList.add("locked","reveal");
    const w = currentChoices[i];
    if(w.thai === currentWord.thai){
      el.classList.add("correct-answer");
    }
    if(i === idx && !isCorrect){
      el.classList.add("wrong-pick");
    }
  });

  if(isCorrect){
    feedback.textContent = "ถูกต้อง! 对了";
    feedback.className = "feedback correct";
    recordSeen(currentWord, "correct");
    doneThisRound++;
  } else {
    feedback.textContent = "ยังไม่ใช่ — คำที่เลือกคือ " + picked.hanzi + " (" + picked.pinyin + ")";
    feedback.className = "feedback wrong";
    recordSeen(currentWord, "wrong");
    doneThisRound++;
    // requeue for retry later this round
    const retryWord = Object.assign({}, currentWord, {_retry:true});
    const insertAt = Math.min(queue.length, 3 + Math.floor(Math.random()*3));
    queue.splice(insertAt, 0, retryWord);
  }

  updateProgress();

  const area = document.getElementById("quizArea");
  const nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  nextBtn.textContent = "ข้อต่อไป →";
  nextBtn.addEventListener("click", nextQuestion);
  area.appendChild(nextBtn);
}

function renderDone(){
  document.getElementById("progressRow").style.display = "none";
  const area = document.getElementById("quizArea");
  area.innerHTML = `
    <div class="done-screen">
      <div class="zh cjk">完成! เคลียร์รอบนี้แล้ว</div>
      <p>ตอบไปทั้งหมด ${doneThisRound} ข้อ — คำที่เคยตอบผิดจะถูกเก็บไว้ใน "ทบทวนคำศัพท์" กดดูได้ตลอดเวลา</p>
      <button id="restartBtn">เล่นรอบใหม่</button>
    </div>
  `;
  document.getElementById("restartBtn").addEventListener("click", ()=> startLevel(currentLevel));
}

/* ---------- LEVEL PICKER ---------- */
document.querySelectorAll(".level-chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    const lvl = chip.dataset.level === "all" ? "all" : Number(chip.dataset.level);
    startLevel(lvl);
  });
});

/* ---------- REVIEW MODAL ---------- */
const overlay = document.getElementById("overlay");
document.getElementById("reviewBtn").addEventListener("click", ()=>{
  renderModal();
  overlay.classList.add("show");
});
document.getElementById("closeModal").addEventListener("click", ()=> overlay.classList.remove("show"));
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) overlay.classList.remove("show"); });

function renderModal(){
  const list = document.getElementById("modalList");
  const entries = Object.values(reviewStore).sort((a,b)=> b.lastSeen - a.lastSeen);
  if(entries.length === 0){
    list.innerHTML = `<div class="empty-note">ยังไม่มีคำที่ทบทวน — เริ่มเลือกระดับด้านบนแล้วเล่นได้เลย</div>`;
    return;
  }
  list.innerHTML = entries.map(w=>{
    const pillClass = w.status === "wrong" ? "status-retry" : "status-ok";
    const pillText = w.status === "wrong" ? "รอทบทวนอีกครั้ง" : "ผ่านแล้ว";
    return `
      <div class="vocab-row">
        <div class="vocab-main">
          <span class="zh cjk">${w.hanzi}</span>
          <span class="py">${w.pinyin}</span>
          <span class="th">${w.thai}</span>
        </div>
        <span class="status-pill ${pillClass}">${pillText}</span>
      </div>
    `;
  }).join("");
}
</script>
</body>
</html>
