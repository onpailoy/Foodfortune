<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กินไรดี? เซียมซี</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap');

:root {
–red: #b82a1a;
–dark-red: #7a0e00;
–deep-red: #3d0500;
–gold: #c8900a;
–bright-gold: #f0b429;
–pale-gold: #f7d87c;
–paper: #fdf3e3;
}

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
min-height: 100vh;
font-family: ‘Noto Sans Thai’, sans-serif;
overflow-x: hidden;
background-color: #0d0200;
position: relative;
}

/* ── BG LAYERS ── */
.bg-floor {
position: fixed; inset: 0; z-index: 0;
background:
repeating-linear-gradient(90deg, rgba(80,20,0,0.15) 0px, rgba(80,20,0,0.15) 1px, transparent 1px, transparent 60px),
repeating-linear-gradient(0deg,  rgba(80,20,0,0.15) 0px, rgba(80,20,0,0.15) 1px, transparent 1px, transparent 60px),
linear-gradient(180deg, #100300 0%, #1c0600 40%, #0d0200 100%);
}

/* Tall red columns left & right edge */
.bg-columns {
position: fixed; inset: 0; pointer-events: none; z-index: 1;
}
.bg-columns::before, .bg-columns::after {
content: ‘’;
position: absolute; top: 0; bottom: 0; width: 56px;
background: linear-gradient(180deg,
#6e0d00 0%, #950f00 10%, #b01800 25%,
#8a1100 50%, #9e1600 70%, #6e0d00 90%, #4a0800 100%);
box-shadow: inset -8px 0 18px rgba(0,0,0,0.6), inset 4px 0 10px rgba(255,140,40,0.1);
}
.bg-columns::before { left: 0; border-right: 2px solid rgba(200,130,10,0.45); }
.bg-columns::after  { right: 0; border-left:  2px solid rgba(200,130,10,0.45); }

/* Ceiling */
.bg-ceiling {
position: fixed; top: 0; left: 0; right: 0; height: 110px;
z-index: 2; pointer-events: none;
background: linear-gradient(180deg, #180400 0%, #280700 50%, transparent 100%);
}
.bg-ceiling::before {
content: ‘’;
position: absolute; inset: 0;
background-image: repeating-linear-gradient(90deg,
rgba(200,100,0,0.06) 0px, rgba(200,100,0,0.06) 1px,
transparent 1px, transparent 20px);
}
.bg-ceiling::after {
content: ‘’;
position: absolute; bottom: 0; left: 0; right: 0; height: 5px;
background: linear-gradient(90deg, #7a0e00, #9e1500 30%, #c8900a 50%, #9e1500 70%, #7a0e00);
box-shadow: 0 3px 14px rgba(200,130,10,0.4);
}

/* Centre plaque */
.bg-banner {
position: fixed; top: 0; left: 50%; transform: translateX(-50%);
width: min(300px, 62vw); height: 76px;
background: linear-gradient(180deg, #960e00, #b81600 50%, #960e00);
border: 1.5px solid rgba(200,130,10,0.65); border-top: none;
box-shadow: inset 0 3px 14px rgba(255,90,0,0.08), 0 3px 22px rgba(0,0,0,0.65);
z-index: 3;
display: flex; align-items: center; justify-content: center;
}
.bg-banner::before {
content: ‘大雄寶殿’;
font-family: ‘Noto Serif TC’, serif;
font-size: 24px; font-weight: 900;
color: var(–pale-gold);
letter-spacing: 4px;
opacity: 0.22;
text-shadow: 0 0 10px rgba(240,180,41,0.5);
}

/* Glow */
.bg-glow {
position: fixed; inset: 0; pointer-events: none; z-index: 2;
background:
radial-gradient(ellipse 60% 35% at 50% 12%, rgba(200,90,10,0.2) 0%, transparent 70%),
radial-gradient(ellipse 80% 25% at 50% 100%, rgba(0,0,0,0.65) 0%, transparent 55%);
}

/* Column gold rings */
.col-ring {
position: fixed; width: 62px; height: 11px; z-index: 5; pointer-events: none;
background: linear-gradient(180deg, var(–pale-gold), #9a6800, var(–pale-gold));
border-radius: 2px;
box-shadow: 0 1px 5px rgba(0,0,0,0.5);
}

/* Lanterns */
.lanterns {
position: fixed; top: 0; left: 0; right: 0; height: 230px;
pointer-events: none; z-index: 4; overflow: hidden;
}
.lantern-el {
position: absolute; top: 0;
display: flex; flex-direction: column; align-items: center;
}
.lantern-cord { width: 1px; height: 38px; background: rgba(160,100,10,0.55); }
.lantern-body {
width: 30px; height: 44px;
background: radial-gradient(ellipse at 35% 35%, #ff5500, #cc1100 55%, #880000);
border-radius: 50% 50% 40% 40% / 45% 45% 55% 55%;
box-shadow: 0 0 20px rgba(255,80,0,0.9), 0 0 45px rgba(200,50,0,0.4), inset 0 -6px 10px rgba(0,0,0,0.3);
position: relative; overflow: hidden;
animation: sway 4s ease-in-out infinite;
}
.lantern-body::before {
content: ‘’;
position: absolute; inset: 0;
background-image: repeating-linear-gradient(180deg,
transparent 0px, transparent 5px,
rgba(0,0,0,0.14) 5px, rgba(0,0,0,0.14) 6px);
}
.lantern-body::after {
content: ‘’;
position: absolute; top: 50%; left: 50%;
transform: translate(-50%,-50%);
width: 9px; height: 9px;
background: radial-gradient(circle, #fff8a0, #ffd700);
border-radius: 50%;
box-shadow: 0 0 8px #ffd700, 0 0 22px rgba(255,200,0,0.5);
}
.lantern-tassel { width: 2px; height: 22px; background: linear-gradient(180deg, #ffd700, #cc8800); border-radius: 1px; }
@keyframes sway {
0%,100% { transform: rotate(-3deg); }
50%      { transform: rotate(3deg); }
}

/* ── APP ── */
.app {
position: relative; z-index: 10;
max-width: 480px; margin: 0 auto;
min-height: 100vh; padding-bottom: 24px;
}

header {
text-align: center;
padding: 86px 16px 10px;
}
.hdr-orn {
display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px;
}
.hdr-orn::before, .hdr-orn::after {
content: ‘’; flex: 1; height: 1px;
}
.hdr-orn::before { background: linear-gradient(to right, transparent, var(–bright-gold)); }
.hdr-orn::after  { background: linear-gradient(to left,  transparent, var(–bright-gold)); }
.hdr-orn span { font-family: ‘Noto Serif TC’, serif; font-size: 13px; color: var(–pale-gold); letter-spacing: 4px; }

h1 {
font-family: ‘Noto Serif TC’, serif; font-size: 30px; font-weight: 900;
color: var(–pale-gold);
text-shadow: 0 0 30px rgba(240,180,41,0.7), 0 0 60px rgba(200,100,10,0.35), 2px 2px 4px rgba(0,0,0,0.9);
letter-spacing: 3px;
}
.subtitle { font-size: 12px; color: rgba(200,140,20,0.55); margin-top: 3px; letter-spacing: 2px; }

/* Tabs */
.tabs { display: flex; gap: 3px; padding: 16px 20px 0; }
.tab {
flex: 1; padding: 10px 4px; text-align: center;
font-size: 12px; font-weight: 600; cursor: pointer;
border-radius: 8px 8px 0 0;
color: rgba(200,140,20,0.4);
border: 1px solid rgba(200,130,10,0.18); border-bottom: none;
background: rgba(18,3,0,0.7);
transition: all 0.22s; user-select: none; letter-spacing: 0.5px;
}
.tab.active {
background: linear-gradient(180deg, #8c1200, #680c00);
color: var(–pale-gold);
border-color: rgba(200,130,10,0.55);
border-bottom: 1px solid #680c00;
text-shadow: 0 0 8px rgba(240,180,41,0.35);
}

/* Panels */
.panel {
display: none; margin: 0 20px; padding: 22px 18px; min-height: 480px;
background: linear-gradient(180deg, rgba(28,4,0,0.93), rgba(16,2,0,0.97));
border: 1px solid rgba(200,130,10,0.4); border-top: 2px solid rgba(200,130,10,0.55);
border-radius: 0 0 12px 12px;
box-shadow: inset 0 1px 0 rgba(255,180,50,0.07), 0 8px 40px rgba(0,0,0,0.75);
position: relative; overflow: hidden;
}
.panel::before {
content: ‘’; position: absolute; inset: 0; pointer-events: none;
background-image:
repeating-linear-gradient(0deg, transparent 0, transparent 30px, rgba(180,80,0,0.025) 30px, rgba(180,80,0,0.025) 31px),
repeating-linear-gradient(90deg, transparent 0, transparent 30px, rgba(180,80,0,0.025) 30px, rgba(180,80,0,0.025) 31px);
}
.panel.active { display: block; }

/* ── FORTUNE ── */
.fortune-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; }

#fortune-container {
position: relative; width: 100%; height: 320px;
display: flex; align-items: center; justify-content: center; overflow: visible;
}

/* Cylinder */
.cylinder {
position: relative; width: 86px; height: 210px;
cursor: pointer; user-select: none; -webkit-user-select: none;
touch-action: none; flex-shrink: 0;
filter: drop-shadow(0 14px 32px rgba(0,0,0,0.75));
}
.cylinder-body {
width: 100%; height: 100%;
background: linear-gradient(155deg,
#b06020 0%, #8a4010 12%, #c07028 28%,
#7a3008 50%, #9a5018 65%, #7a3008 80%, #b06020 100%);
border-radius: 10px 10px 6px 6px;
position: relative;
box-shadow:
inset -10px 0 22px rgba(0,0,0,0.6),
inset 5px 0 12px rgba(255,200,100,0.13),
inset 0 -8px 14px rgba(0,0,0,0.4);
overflow: hidden;
border: 1.5px solid rgba(200,130,10,0.5);
}
.cylinder-body::after {
content: ‘’; position: absolute; inset: 0;
background-image: repeating-linear-gradient(168deg,
transparent 0, transparent 8px,
rgba(0,0,0,0.07) 8px, rgba(0,0,0,0.07) 9px);
}
.cyl-char {
position: absolute; top: 50%; left: 50%;
transform: translate(-50%,-50%);
font-family: ‘Noto Serif TC’, serif; font-size: 44px;
color: rgba(200,130,10,0.32); text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
z-index: 1; pointer-events: none;
}
.cylinder-ring {
position: absolute; left: -5px; right: -5px; height: 16px;
background: linear-gradient(180deg, #f7d87c 0%, #c8900a 30%, #8a6000 50%, #c8900a 70%, #f7d87c 100%);
border-radius: 4px; z-index: 3;
box-shadow: 0 2px 7px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
}
.cylinder-ring.top    { top: -5px; }
.cylinder-ring.bottom { bottom: -5px; }
.cylinder-base {
position: absolute; left: -8px; right: -8px; bottom: -18px; height: 18px;
background: linear-gradient(180deg, #7a3008, #4a1800);
border-radius: 0 0 8px 8px; border: 1.5px solid rgba(200,130,10,0.38); border-top: none; z-index: 2;
}
.cylinder-sticks {
position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; width: 68px; z-index: 2;
}
.mini-stick {
width: 5px; height: 58px;
background: linear-gradient(180deg, #fff0c0 0%, #e8c060 14%, #c8900a 40%, #7a5800 80%, #4a2800 100%);
border-radius: 2px 2px 0 0; box-shadow: 1px 0 3px rgba(0,0,0,0.4);
}

/* Progress rect */
.progress-ring-wrap {
position: absolute; width: 112px; height: 250px;
pointer-events: none; opacity: 0; transition: opacity 0.2s;
}
.progress-ring-wrap.visible { opacity: 1; }
#progressCircle {
fill: none; stroke: var(–bright-gold); stroke-width: 3;
stroke-dasharray: 700; stroke-dashoffset: 700; stroke-linecap: round;
filter: drop-shadow(0 0 7px var(–bright-gold));
}
.charge-label {
position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
font-size: 11px; color: var(–bright-gold); opacity: 0;
white-space: nowrap; text-shadow: 0 0 8px var(–gold);
transition: opacity 0.2s; font-family: ‘Noto Serif TC’, serif;
}
.charge-label.visible { opacity: 1; }

/* Hold hint */
.hold-hint {
font-size: 12px; color: rgba(200,140,20,0.6); text-align: center; letter-spacing: 1px;
animation: pulse-hint 2.5s ease-in-out infinite;
}
@keyframes pulse-hint {
0%,100% { opacity: 0.5; }
50%      { opacity: 1; color: rgba(240,180,41,0.9); }
}

/* Flying stick */
.flying-stick {
position: absolute; width: 11px; height: 155px;
border-radius: 4px 4px 2px 2px;
background: linear-gradient(180deg,
#fff8e0 0%, #f0e0a0 8%, #d4a017 28%, #8b6914 68%, #5c3d0f 100%);
box-shadow: 2px 2px 10px rgba(0,0,0,0.6),
inset -2px 0 5px rgba(0,0,0,0.22), 0 0 0 1px rgba(180,120,10,0.4);
display: none; z-index: 20;
left: 50%; top: 50%; transform: translate(-50%,-50%);
}
.stick-text {
position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
writing-mode: vertical-rl;
font-family: ‘Noto Serif TC’, serif; font-size: 10px; font-weight: 700;
color: #7a0e00; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
max-height: 125px; letter-spacing: 1px;
}

/* Result */
.result-card {
display: none; flex-direction: column; align-items: center; gap: 14px;
animation: reveal 0.5s ease-out; width: 100%;
}
.result-card.show { display: flex; }
@keyframes reveal {
from { opacity: 0; transform: translateY(14px) scale(0.97); }
to   { opacity: 1; transform: translateY(0) scale(1); }
}
.result-stick-display {
width: 54px; height: 190px;
border-radius: 6px 6px 4px 4px;
background: linear-gradient(180deg,
#fff8e0 0%, #f0e0a0 8%, #d4a017 28%, #8b6914 68%, #5c3d0f 100%);
box-shadow:
4px 4px 20px rgba(0,0,0,0.7), inset -3px 0 8px rgba(0,0,0,0.28),
0 0 0 1.5px rgba(200,130,10,0.6), 0 0 22px rgba(200,130,10,0.2);
display: flex; align-items: center; justify-content: center;
}
.result-stick-name {
writing-mode: vertical-rl;
font-family: ‘Noto Serif TC’, serif; font-size: 13px; font-weight: 700;
color: #7a0e00; letter-spacing: 2px;
max-height: 160px; overflow: hidden; text-overflow: ellipsis;
}
.result-name-th {
font-family: ‘Noto Sans Thai’, sans-serif; font-size: 22px; font-weight: 700;
color: var(–pale-gold);
text-shadow: 0 0 16px rgba(240,180,41,0.5), 1px 1px 3px rgba(0,0,0,0.8);
text-align: center; letter-spacing: 1px;
}
.go-buttons { display: flex; gap: 10px; width: 100%; }
.go-btn {
flex: 1; padding: 14px; border: none; border-radius: 10px;
font-family: ‘Noto Sans Thai’, sans-serif; font-size: 17px; font-weight: 700;
cursor: pointer; transition: transform 0.1s, filter 0.1s; letter-spacing: 1px;
}
.go-btn:active { transform: scale(0.95); filter: brightness(0.88); }
.btn-go {
background: linear-gradient(135deg, #b82a1a, #7a0e00);
color: var(–pale-gold);
box-shadow: 0 4px 20px rgba(184,42,26,0.45), inset 0 1px 0 rgba(255,255,255,0.09);
border: 1.5px solid rgba(200,130,10,0.65);
text-shadow: 0 0 8px rgba(240,180,41,0.3);
}
.btn-nogo {
background: linear-gradient(135deg, #222, #141414);
color: rgba(255,255,255,0.45);
box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
border: 1.5px solid rgba(255,255,255,0.08);
}
.btn-retry {
width: 100%; padding: 11px; background: transparent;
border: 1px solid rgba(200,130,10,0.28); border-radius: 8px;
color: rgba(200,140,20,0.5);
font-family: ‘Noto Sans Thai’, sans-serif; font-size: 14px;
cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
}
.btn-retry:hover { border-color: var(–gold); color: var(–bright-gold); }

/* ── MANAGE ── */
.section-label {
font-size: 11px; color: rgba(200,130,10,0.45); text-transform: uppercase;
letter-spacing: 3px; margin-bottom: 10px; font-family: ‘Noto Serif TC’, serif;
}
.add-form { display: flex; gap: 8px; margin-bottom: 18px; }
.input-restaurant {
flex: 1; background: rgba(255,255,255,0.04);
border: 1px solid rgba(200,130,10,0.22); border-radius: 8px;
padding: 10px 14px; color: var(–paper);
font-family: ‘Noto Sans Thai’, sans-serif; font-size: 15px; outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
}
.input-restaurant:focus { border-color: var(–gold); box-shadow: 0 0 0 2px rgba(200,130,10,0.14); }
.input-restaurant::placeholder { color: rgba(255,255,255,0.18); }
.btn-add {
background: linear-gradient(135deg, #9e1500, #7a0e00);
color: var(–pale-gold); border: 1.5px solid rgba(200,130,10,0.55);
border-radius: 8px; padding: 10px 16px;
font-family: ‘Noto Sans Thai’, sans-serif; font-size: 15px; font-weight: 700;
cursor: pointer; transition: filter 0.2s; letter-spacing: 1px;
}
.btn-add:active { filter: brightness(0.84); }
.restaurant-list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
.restaurant-list::-webkit-scrollbar { width: 3px; }
.restaurant-list::-webkit-scrollbar-thumb { background: var(–gold); border-radius: 2px; }
.rest-item {
display: flex; align-items: center; gap: 10px;
background: rgba(255,255,255,0.03); border: 1px solid rgba(200,130,10,0.1);
border-radius: 8px; padding: 10px 14px;
animation: slide-in 0.2s ease-out;
}
@keyframes slide-in {
from { opacity: 0; transform: translateX(-8px); }
to   { opacity: 1; transform: translateX(0); }
}
.rest-icon { font-size: 17px; width: 26px; text-align: center; }
.rest-name { flex: 1; color: var(–paper); font-size: 15px; }
.rest-delete {
background: none; border: none; color: rgba(255,255,255,0.18); font-size: 16px;
cursor: pointer; padding: 2px 8px; border-radius: 4px;
transition: color 0.2s, background 0.2s;
}
.rest-delete:hover { color: var(–red); background: rgba(184,42,26,0.1); }
.empty-hint { text-align: center; color: rgba(255,255,255,0.18); font-size: 13px; padding: 40px 0; line-height: 2.4; }

/* ── STATS ── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.stat-card {
background: rgba(255,255,255,0.03); border: 1px solid rgba(200,130,10,0.16);
border-radius: 10px; padding: 16px; text-align: center;
}
.stat-number {
font-family: ‘Noto Serif TC’, serif; font-size: 38px; font-weight: 900;
color: var(–pale-gold); text-shadow: 0 0 14px rgba(240,180,41,0.38); line-height: 1;
}
.stat-label { font-size: 12px; color: rgba(255,255,255,0.38); margin-top: 6px; }
.rest-stats { display: flex; flex-direction: column; gap: 7px; max-height: 280px; overflow-y: auto; }
.rest-stats::-webkit-scrollbar { width: 3px; }
.rest-stats::-webkit-scrollbar-thumb { background: var(–gold); border-radius: 2px; }
.rest-stat-item {
background: rgba(255,255,255,0.03); border: 1px solid rgba(200,130,10,0.1);
border-radius: 8px; padding: 10px 14px;
}
.rest-stat-name { font-size: 14px; color: var(–paper); margin-bottom: 6px; }
.stat-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.stat-bar-label { color: rgba(255,255,255,0.32); width: 40px; }
.stat-bar-track { flex: 1; height: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.stat-bar-fill.go   { background: linear-gradient(90deg, #9e1500, #e04020); }
.stat-bar-fill.nogo { background: linear-gradient(90deg, #2e2e2e, #555); }
.stat-bar-count { color: rgba(255,255,255,0.38); width: 20px; text-align: right; }
.btn-clear-stats {
width: 100%; margin-top: 14px; padding: 10px; background: transparent;
border: 1px solid rgba(255,50,50,0.14); border-radius: 8px; color: rgba(255,80,80,0.32);
font-family: ‘Noto Sans Thai’, sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.btn-clear-stats:hover { border-color: rgba(255,50,50,0.38); color: rgba(255,80,80,0.68); }

/* ── ANIM ── */
@keyframes shake {
0%,100% { transform: rotate(0deg); }
10%  { transform: rotate(-6deg) translateY(-2px); }
25%  { transform: rotate(8deg)  translateY(-4px); }
40%  { transform: rotate(-9deg) translateY(-5px); }
55%  { transform: rotate(9deg)  translateY(-4px); }
70%  { transform: rotate(-7deg) translateY(-5px); }
85%  { transform: rotate(6deg)  translateY(-3px); }
}
.shaking { animation: shake 0.32s ease-in-out infinite; }

@keyframes fly-out {
0%   { transform: translate(-50%,-50%) rotate(0deg) scale(1); opacity: 1; }
30%  { transform: translate(calc(-50% + 58px), calc(-50% - 95px))  rotate(24deg) scale(1.1); opacity: 1; }
65%  { transform: translate(calc(-50% + 26px), calc(-50% - 165px)) rotate(13deg) scale(1.04); opacity: 0.82; }
100% { transform: translate(calc(-50% + 6px),  calc(-50% - 225px)) rotate(4deg)  scale(0.82); opacity: 0; }
}
.flying { animation: fly-out 0.66s cubic-bezier(0.18,0.52,0.38,0.95) forwards; }

/* Toast */
.toast {
position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
background: rgba(8,1,0,0.97); border: 1px solid rgba(200,130,10,0.55); border-radius: 10px;
padding: 12px 24px; color: var(–pale-gold); font-size: 14px; font-weight: 600;
transition: transform 0.3s ease; z-index: 100; white-space: nowrap;
box-shadow: 0 8px 40px rgba(0,0,0,0.75), 0 0 18px rgba(200,130,10,0.12);
letter-spacing: 0.5px;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Sparks */
.spark {
position: fixed; width: 5px; height: 5px; border-radius: 50%;
background: var(–bright-gold); pointer-events: none; z-index: 50;
box-shadow: 0 0 6px var(–bright-gold);
animation: spark-fly 0.9s ease-out forwards;
}
@keyframes spark-fly {
0%   { opacity: 1; transform: translate(0,0) scale(1); }
100% { opacity: 0; transform: translate(var(–dx),var(–dy)) scale(0.15); }
}

footer {
text-align: center; padding: 18px;
color: rgba(200,130,10,0.22); font-size: 11px; letter-spacing: 3px;
font-family: ‘Noto Serif TC’, serif;
}
</style>

</head>

  </div>

  <div class="panel" id="panel-manage">

<div class="toast" id="toast"></div>

<script>
// ── BUILD LANTERNS ──
(function(){
  const c = document.getElementById('lanterns');
  [{l:7,d:0,s:1},{l:20,d:0.8,s:0.78},{l:34,d:1.5,s:0.88},
   {l:66,d:0.4,s:0.88},{l:80,d:1.1,s:0.78},{l:93,d:0.1,s:1}]
  .forEach(p=>{
    const el = document.createElement('div');
    el.className='lantern-el';
    el.style.cssText=`left:${p.l}%;transform-origin:top center;transform:scale(${p.s})`;
    el.innerHTML=`<div class="lantern-cord"></div>
      <div class="lantern-body" style="animation-delay:${p.d}s"></div>
      <div class="lantern-tassel"></div>`;
    c.appendChild(el);
  });
})();

// ── BUILD COLUMN RINGS ──
(function(){
  const c = document.getElementById('colRings');
  [12,30,50,68,86].forEach(h=>{
    ['left:-3px','right:-3px'].forEach(s=>{
      const el=document.createElement('div');
      el.className='col-ring';
      el.style.cssText=`top:${h}vh;${s}`;
      c.appendChild(el);
    });
  });
})();

// ── STATE ──
let restaurants = JSON.parse(localStorage.getItem('fortune_restaurants')||'[]');
let stats       = JSON.parse(localStorage.getItem('fortune_stats')||'{}');
let currentResult = null;
if(!restaurants.length){
  restaurants=['ข้าวมันไก่','ผัดไทย','ส้มตำ','ราเมน','พิซซ่า'];
  saveRestaurants();
}

// ── HOLD LOGIC ── (กดค้าง → ปล่อย = โยน, กดสั้น < 300ms = ยังไม่โยน)
let holdStart=null, holdInterval=null, isHolding=false, isRevealed=false;
const MIN_HOLD=300;

function startHold(e){
  e.preventDefault();
  if(isRevealed) return;
  if(!restaurants.length){showToast('เพิ่มร้านอาหารก่อนนะ 🍜');return;}
  holdStart=Date.now(); isHolding=true;
  document.getElementById('progressRing').classList.add('visible');
  document.getElementById('chargeLabel').classList.add('visible');
  document.getElementById('cylinder').classList.add('shaking');
  const labels=['กำลังสั่น...','สั่นแล้ว!','แรงขึ้น!','โยนได้เลย!','พร้อมโยน!'];
  holdInterval=setInterval(()=>{
    const pct=Math.min((Date.now()-holdStart)/2000,1);
    document.getElementById('progressCircle').style.strokeDashoffset=700*(1-pct);
    document.getElementById('cylinder').style.animationDuration=Math.max(0.18,0.32-pct*0.14)+'s';
    document.getElementById('chargeLabel').textContent=labels[Math.min(Math.floor(pct*5),4)];
  },30);
}

function endHold(e){
  if(e) e.preventDefault();
  if(!isHolding) return;
  isHolding=false;
  clearInterval(holdInterval);
  const held=Date.now()-holdStart;
  // reset visuals
  document.getElementById('cylinder').classList.remove('shaking');
  document.getElementById('cylinder').style.animationDuration='';
  document.getElementById('progressRing').classList.remove('visible');
  document.getElementById('chargeLabel').classList.remove('visible');
  document.getElementById('progressCircle').style.strokeDashoffset=700;
  holdStart=null;
  if(isRevealed) return;
  if(held>=MIN_HOLD) triggerFortune();
}

function cancelHold(){
  if(!isHolding) return;
  isHolding=false; clearInterval(holdInterval);
  document.getElementById('cylinder').classList.remove('shaking');
  document.getElementById('cylinder').style.animationDuration='';
  document.getElementById('progressRing').classList.remove('visible');
  document.getElementById('chargeLabel').classList.remove('visible');
  document.getElementById('progressCircle').style.strokeDashoffset=700;
  holdStart=null;
}

function triggerFortune(){
  currentResult=restaurants[Math.floor(Math.random()*restaurants.length)];
  const stick=document.getElementById('flyingStick');
  document.getElementById('flyingStickText').textContent=currentResult;
  stick.style.display='block'; stick.classList.remove('flying');
  void stick.offsetWidth; stick.classList.add('flying');
  spawnSparks();
  setTimeout(()=>{
    stick.style.display='none'; stick.classList.remove('flying');
    isRevealed=true; showResult(currentResult);
  },680);
}

function showResult(name){
  document.getElementById('resultStickName').textContent=name;
  document.getElementById('resultNameTh').textContent=name;
  document.getElementById('holdHint').style.display='none';
  document.getElementById('cylinder').style.display='none';
  document.getElementById('resultCard').classList.add('show');
}

function resetFortune(){
  isRevealed=false; currentResult=null;
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('holdHint').style.display='';
  document.getElementById('cylinder').style.display='';
  cancelHold();
}

function recordDecision(go){
  if(!currentResult) return;
  const k=currentResult;
  if(!stats[k]) stats[k]={go:0,nogo:0};
  if(go) stats[k].go++; else stats[k].nogo++;
  saveStats();
  showToast(go?`✅ สนุกกับ ${k} นะ!`:`❌ ไว้คราวหน้า ${k}!`);
  setTimeout(resetFortune,900);
}

function spawnSparks(){
  const r=document.getElementById('cylinder').getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/3;
  for(let i=0;i<18;i++){
    const s=document.createElement('div'); s.className='spark';
    const a=Math.random()*2*Math.PI, d=50+Math.random()*100;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.cssText+=`;left:${cx}px;top:${cy}px;animation-delay:${Math.random()*0.25}s`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1100);
  }
}

// ── MANAGE ──
function addRestaurant(){
  const inp=document.getElementById('newRestInput');
  const name=inp.value.trim(); if(!name) return;
  if(restaurants.includes(name)){showToast('มีร้านนี้แล้ว 🔁');return;}
  restaurants.push(name); saveRestaurants();
  renderRestaurantList(); renderCylinderSticks();
  inp.value=''; showToast(`เพิ่ม "${name}" แล้ว 🎉`);
}
function deleteRestaurant(name){
  restaurants=restaurants.filter(r=>r!==name); saveRestaurants();
  renderRestaurantList(); renderCylinderSticks();
}
function renderRestaurantList(){
  const list=document.getElementById('restaurantList');
  if(!restaurants.length){list.innerHTML='<div class="empty-hint">ยังไม่มีร้านอาหาร<br>เพิ่มร้านที่คุณชอบ 🍜</div>';return;}
  const icons=['🍜','🍣','🍕','🍔','🌮','🥘','🍱','🍛','🍝','🥗','🍖','🍤'];
  list.innerHTML=restaurants.map((r,i)=>`
    <div class="rest-item">
      <span class="rest-icon">${icons[i%icons.length]}</span>
      <span class="rest-name">${r}</span>
      <button class="rest-delete" onclick="deleteRestaurant('${r.replace(/'/g,"\\'")}')">✕</button>
    </div>`).join('');
}
function renderCylinderSticks(){
  const c=document.getElementById('cylinderSticks');
  c.innerHTML=Array(Math.min(restaurants.length,9)).fill('<div class="mini-stick"></div>').join('');
}

// ── STATS ──
function renderStats(){
  let tG=0,tN=0; Object.values(stats).forEach(s=>{tG+=s.go;tN+=s.nogo;});
  document.getElementById('totalGo').textContent=tG;
  document.getElementById('totalNogo').textContent=tN;
  const c=document.getElementById('restStats');
  const entries=Object.entries(stats).filter(([k])=>restaurants.includes(k));
  if(!entries.length){c.innerHTML='<div class="empty-hint">ยังไม่มีสถิติ<br>ลองเสี่ยงเซียมซีดูสิ 🎋</div>';return;}
  c.innerHTML=entries.sort((a,b)=>(b[1].go+b[1].nogo)-(a[1].go+a[1].nogo)).map(([n,s])=>{
    const t=s.go+s.nogo, gw=t?Math.round(s.go/t*100):0;
    return `<div class="rest-stat-item">
      <div class="rest-stat-name">${n} <span style="color:rgba(255,255,255,0.22);font-size:11px;">(${t} ครั้ง)</span></div>
      <div class="stat-bar-row">
        <span class="stat-bar-label">ไป</span>
        <div class="stat-bar-track"><div class="stat-bar-fill go" style="width:${gw}%"></div></div>
        <span class="stat-bar-count">${s.go}</span>
      </div>
      <div class="stat-bar-row" style="margin-top:4px">
        <span class="stat-bar-label">ไม่ไป</span>
        <div class="stat-bar-track"><div class="stat-bar-fill nogo" style="width:${100-gw}%"></div></div>
        <span class="stat-bar-count">${s.nogo}</span>
      </div>
    </div>`;
  }).join('');
}
function clearStats(){
  if(!confirm('ล้างสถิติทั้งหมด?')) return;
  stats={}; saveStats(); renderStats(); showToast('ล้างสถิติแล้ว 🗑');
}

// ── TABS ──
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>
    t.classList.toggle('active',['fortune','manage','stats'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='stats') renderStats();
  if(name==='manage') renderRestaurantList();
}

// ── TOAST ──
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function saveRestaurants(){localStorage.setItem('fortune_restaurants',JSON.stringify(restaurants));}
function saveStats(){localStorage.setItem('fortune_stats',JSON.stringify(stats));}

renderRestaurantList(); renderCylinderSticks();
</script>

</body>
